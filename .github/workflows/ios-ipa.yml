name: iOS IPA for AltStore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and verify
        run: |
          npm ci
          npx tsc --noEmit
          npx expo lint
          node scripts/check-app-audit.cjs
          node scripts/check-chat-recorder.cjs
          node scripts/check-schedule.cjs
          node scripts/check-games.cjs
          node scripts/check-blocks.cjs
      - name: Generate native project
        env:
          CI: '1'
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        working-directory: ios
        run: pod install
      - name: Build unsigned device archive
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$workspace"
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CATEC.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            archive
      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          app=$(find "$RUNNER_TEMP/CATEC.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          test -f "$app/main.jsbundle"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/CATEC-SuperApp-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CATEC-SuperApp-unsigned
          path: CATEC-SuperApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
